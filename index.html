
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Calificaciones</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">

        <h1>Registro de Calificaciones</h1>

        <form id="formulario">

            <label for="nombre">Nombre del alumno:</label>
            <input type="text" id="nombre" required>

            <label for="matematicas">Matemáticas:</label>
            <input type="number" id="matematicas" min="0" max="10" required>

            <label for="espanol">Español:</label>
            <input type="number" id="espanol" min="0" max="10" required>

            <label for="historia">Historia:</label>
            <input type="number" id="historia" min="0" max="10" required>

            <button type="submit">Registrar alumno</button>

        </form>

        <h2>Alumnos registrados</h2>

        <div id="listaAlumnos"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
